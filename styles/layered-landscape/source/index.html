   scene scaffold (base.html) flushes them into the scene's own <defs>. Characters are real rigs (L.person -> fig.pose). */
(function(){
const L={};
const f=n=>Math.round(n*10)/10; L.f=f;
L.rng=function(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
L.defs=[];let uid=0;L.id=p=>(p||'g')+(++uid);
const stopStr=st=>st.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('');
L.lin=function(stops,x1,y1,x2,y2){const id=L.id('lg');L.defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}">${stopStr(stops)}</linearGradient>`);return `url(#${id})`;};
L.rad=function(stops,cx,cy,r,sy){const id=L.id('rg');const tr=sy?` gradientTransform="translate(${f(cx)} ${f(cy)}) scale(1 ${sy}) translate(${f(-cx)} ${f(-cy)})"`:'';L.defs.push(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"${tr}>${stopStr(stops)}</radialGradient>`);return `url(#${id})`;};
L.clip=function(inner){const id=L.id('cp');L.defs.push(`<clipPath id="${id}">${inner}</clipPath>`);return `url(#${id})`;};
L.hex=function(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];};
L.mix=function(a,b,t){const A=L.hex(a),B=L.hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const ss=t=>t<=0?0:t>=1?1:t*t*(3-2*t);L.ss=ss;
L.clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- palette (NOTES.md; no brown anywhere) ---------- */
L.C={navy:'#1B2350',navyL:'#2E3B82',ink:'#24337A',kick:'#2B3A80',red:'#E5323B',redL:'#F2646A',redD:'#B4232D',
  fg0:'#1E2556',fg1:'#2C3679',shrubL:'#33418F',shrubD:'#262F6E',green0:'#23867F',green1:'#7EC0BF',teal:'#22A08C',tealL:'#3DBDA4',
  leafL:'#33B99E',leafD:'#167A7A',leafB:'#0F5C66',trunk:'#232B6C',trunkD:'#3B4794',bankA:'#8394DB',bankB:'#6475C9',
  hill1:'#C9D1F2',hill2:'#AEBBEC',hill3:'#93A4E3',lilac:'#6A62CB',lilacL:'#8B84DF',lilacD:'#5249AE',white:'#FFFFFF',mist:'#E6E3F6'};
L.PAL={leafL:'#33B99E',leafD:'#167A7A',leafB:'#0F5C66',trunk:'#232B6C',trunkD:'#3B4794'};

/* Catmull-Rom through points -> smooth cubic path (open) */
L.curve=function(pts,k){k=k==null?1:k;let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6*k)} ${f(p1[1]+(p2[1]-p0[1])/6*k)} ${f(p2[0]-(p3[0]-p1[0])/6*k)} ${f(p2[1]-(p3[1]-p1[1])/6*k)} ${f(p2[0])} ${f(p2[1])}`;}
  return d;};
L.poly=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
L.line=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L');

/* ridge: o={x0,x1,y,amp,freq,seed,step,bumps:[[cx,h,w]],falls:[[x,dir,toY,w]],jag (craggy mountains)} ; default width
   -420..2340 so long trucks and the parallax transition never reveal an edge */
L.ridgePts=function(o){const r=L.rng(o.seed||1);const ph=[r()*6.283,r()*6.283,r()*6.283];const fr=o.freq||0.004,st=o.step||40;const pts=[];
  const x0=o.x0!=null?o.x0:-420,x1=o.x1!=null?o.x1:2340;
  for(let x=x0;x<=x1+0.01;x+=st){let y=o.y+(o.amp||0)*(0.6*Math.sin(x*fr+ph[0])+0.28*Math.sin(x*fr*2.37+ph[1])+0.12*Math.sin(x*fr*5.3+ph[2]));
    if(o.jag)y+=(r()-0.5)*o.jag;
    if(o.bumps)for(const b of o.bumps){const dx=(x-b[0])/b[2];y-=b[1]*(o.peak?Math.max(0,1-Math.abs(dx)):Math.exp(-dx*dx));}
    if(o.falls)for(const q of o.falls){const s=ss(q[1]*(x-q[0])/q[3]);y=y+(q[2]-y)*s;}
    pts.push([x,y]);}
  return pts;};
L.yAt=function(pts,x){for(let i=0;i<pts.length-1;i++){if(x>=pts[i][0]&&x<=pts[i+1][0]){const t=(x-pts[i][0])/(pts[i+1][0]-pts[i][0]);return pts[i][1]+(pts[i+1][1]-pts[i][1])*t;}}return x<pts[0][0]?pts[0][1]:pts[pts.length-1][1];};
L.ridge=function(o){const pts=L.ridgePts(o);const B=o.bottom||1300;const top=o.jag||o.sharp?L.line(pts):L.curve(pts);
  return{pts,top,d:top+`L${f(pts[pts.length-1][0])} ${B}L${f(pts[0][0])} ${B}Z`,min:Math.min(...pts.map(p=>p[1]))};};
/* a filled ridge layer with vertical haze gradient (colour at crest -> mist at base) */
L.layer=function(o){const R=L.ridge(o);const y0=o.gy0!=null?o.gy0:R.min,y1=o.gy1!=null?o.gy1:(o.base||R.min+160);
  const fill=o.flat?o.c0:L.lin([[0,o.c0],[o.mid!=null?o.mid:0.45,o.c1?L.mix(o.c0,o.c1,0.35):o.c0],[1,o.c1||o.c0]],0,y0,0,y1);
  let s=`<path d="${R.d}" fill="${fill}"/>`;
  if(o.rows){const cp=L.clip(`<path d="${R.d}"/>`);let q='';for(let i=0;i<o.rows.n;i++){const k=o.rows.gap*(i+0.6)*(1+i*0.12);q+=`<path d="${R.top}" transform="translate(0 ${f(k)})" fill="none" stroke="${o.rows.c||'#FFFFFF'}" stroke-opacity="${o.rows.op||0.12}" stroke-width="${f((o.rows.w||6)*(1+i*0.18))}" stroke-linecap="round"/>`;}s+=`<g clip-path="${cp}">${q}</g>`;}
  if(o.rim)s+=`<path d="${R.top}" fill="none" stroke="${o.rim}" stroke-width="${o.rimW||3}" stroke-linecap="round" stroke-linejoin="round" opacity="${o.rimO||0.55}"/>`;
  return{svg:s,pts:R.pts,top:R.min,d:R.d,line:R.top};};

/* sky: vertical gradient + soft glow */
L.sky=function(stops,y1,glow){let s=`<rect x="-20" y="-20" width="1960" height="1120" fill="${L.lin(stops,0,0,0,y1||660)}"/>`;
  if(glow)s+=`<rect x="-20" y="-20" width="1960" height="${glow[4]||760}" fill="${L.rad([[0,glow[3]||'#FFF3F6',glow[5]!=null?glow[5]:0.85],[1,glow[3]||'#FFF3F6',0]],glow[0],glow[1],glow[2],0.55)}"/>`;return s;};

/* flat layered cloud: scalloped top, flat bottom, white with lilac underside + offset shadow lobe */
L.cloud=function(x,y,w,seed,o){o=o||{};const r=L.rng(seed);const n=o.n||5;const h=o.h||w*0.26;
  const xs=[0];for(let i=1;i<n;i++)xs.push(i/n+(r()-0.5)*0.04);xs.push(1);
  const top=xs.map((u,i)=>{const e=Math.sin(Math.PI*u);return[x+u*w,y-(i==0||i==n?h*0.12:h*(0.35+0.65*e)*(0.75+0.35*r()))];});
  const path=pts=>{let d=`M${f(x)} ${f(y)}L${f(pts[0][0])} ${f(pts[0][1])}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const ch=Math.hypot(b[0]-a[0],b[1]-a[1]);d+=`A${f(ch*0.52)} ${f(ch*0.52)} 0 0 1 ${f(b[0])} ${f(b[1])}`;}return d+`L${f(x+w)} ${f(y)}Z`;};
  const g=L.lin([[0,o.top||'#FFFFFF'],[0.62,o.top||'#FFFFFF'],[1,o.bot||'#DCE3F7']],0,y-h,0,y);
  const sh=top.map(p=>[p[0]+w*0.04,p[1]+h*0.18]);
  return `<g opacity="${o.op||1}"><path d="${path(sh)}" fill="${o.sh||'#D3DBF4'}" transform="translate(${f(w*0.03)} 0)"/><path d="${path(top)}" fill="${g}"/></g>`;};
L.CB={top:'#FBF8FF',bot:'#E3E1F6',sh:'#DCDDF4',op:0.92};      /* far cloud bank (lilac, recedes) */
L.PK={top:'#FFF5F9',bot:'#F2D2E2',sh:'#EAC8DC'};              /* sunrise / dusk pink clouds */

/* tapered stroke along a cubic bezier -> filled path */
L.taper=function(p0,p1,p2,p3,w0,w1,n){n=n||18;const L1=[],R1=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;const x=u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],y=u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1];
    const dx=3*u*u*(p1[0]-p0[0])+6*u*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),dy=3*u*u*(p1[1]-p0[1])+6*u*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1]);const m=Math.hypot(dx,dy)||1;
    const w=(w0+(w1-w0)*t)/2;L1.push([x-dy/m*w,y+dx/m*w]);R1.push([x+dy/m*w,y-dx/m*w]);}
  return L.poly(L1.concat(R1.reverse()));};

/* palm frond: quadratic spine, two-tone halves, serrated lower edge */
L.frond=function(T,ang,len,droop,wid,cL,cD,serr){const a=ang*Math.PI/180;const E=[T[0]+Math.cos(a)*len,T[1]+Math.sin(a)*len+droop*len];const C=[T[0]+Math.cos(a)*len*0.5,T[1]+Math.sin(a)*len*0.5-len*0.22];
  const N=30;const sp=[],up=[],dn=[];let flip=null;
  for(let i=0;i<=N;i++){const s=i/N,u=1-s;const x=u*u*T[0]+2*u*s*C[0]+s*s*E[0],y=u*u*T[1]+2*u*s*C[1]+s*s*E[1];
    const tx=2*u*(C[0]-T[0])+2*s*(E[0]-C[0]),ty=2*u*(C[1]-T[1])+2*s*(E[1]-C[1]);const m=Math.hypot(tx,ty)||1;let nx=-ty/m,ny=tx/m;
    if(flip===null)flip=ny>0?-1:1;nx*=flip;ny*=flip;
    const w=wid*Math.pow(Math.sin(Math.PI*Math.pow(s,0.75)),0.85);const sw=serr?(1-0.42*((s*13)%1)):1;
    sp.push([x,y]);up.push([x+nx*w*0.8,y+ny*w*0.8]);dn.push([x-nx*w*sw,y-ny*w*sw]);}
  return `<path d="${L.poly(up.concat(dn.slice().reverse()))}" fill="${cD}"/><path d="${L.poly(up.concat(sp.slice().reverse()))}" fill="${cL}"/>`;};

/* date palm: o={lean,trunk,trunkD,leafL,leafD,sil(single colour),fronds,dates} */
L.palm=function(x,y,h,o){o=Object.assign({},L.PAL,o||{});const lean=o.lean||0;const T=[x+lean,y-h];const sil=o.sil;
  const tc=sil||o.trunk,td=sil||o.trunkD;
  let s=`<path d="${L.taper([x,y],[x+lean*0.05,y-h*0.4],[x+lean*0.55,y-h*0.8],T,h*0.07,h*0.036,16)}" fill="${tc}"/>`;
  if(!sil){for(let i=1;i<11;i++){const t=i/11,u=1-t;const px=u*u*u*x+3*u*u*t*(x+lean*0.05)+3*u*t*t*(x+lean*0.55)+t*t*t*T[0],py=u*u*u*y+3*u*u*t*(y-h*0.4)+3*u*t*t*(y-h*0.8)+t*t*t*T[1];const w=(h*0.07+(h*0.036-h*0.07)*t)/2;
    s+=`<path d="M${f(px-w*0.9)} ${f(py-w*0.15)}Q${f(px)} ${f(py+w*0.55)} ${f(px+w*0.9)} ${f(py-w*0.15)}" fill="none" stroke="${td}" stroke-width="${f(Math.max(1.2,h*0.008))}" stroke-linecap="round"/>`;}}
  const L0=h*(o.fl||0.5),W=h*(o.fw||0.075);
  const fr=o.fronds||[[-172,0.85,0.55],[-150,0.95,0.32],[-125,0.8,0.12],[-98,0.62,0.02],[-72,0.66,0.06],[-48,0.85,0.18],[-24,0.95,0.38],[-4,0.85,0.6],[160,0.7,0.95],[20,0.7,0.95]];
  const back=fr.filter(q=>q[0]>90||q[0]<-180),front=fr.filter(q=>!(q[0]>90||q[0]<-180));
  const lD=sil||o.leafD,lL=sil||o.leafL,lB=sil||o.leafB;
  for(const q of back)s+=L.frond(T,q[0],L0*q[1],q[2],W,lB,lB,!sil);
  if(o.dates&&!sil){for(const d of[-1,1])s+=`<g fill="${o.dates}"><circle cx="${f(T[0]+d*h*0.04)}" cy="${f(T[1]+h*0.06)}" r="${f(h*0.022)}"/><circle cx="${f(T[0]+d*h*0.055)}" cy="${f(T[1]+h*0.09)}" r="${f(h*0.02)}"/><circle cx="${f(T[0]+d*h*0.03)}" cy="${f(T[1]+h*0.1)}" r="${f(h*0.019)}"/></g>`;}
  for(const q of front)s+=L.frond(T,q[0],L0*q[1],q[2],W,lL,lD,!sil);
  if(!sil)s+=`<circle cx="${f(T[0])}" cy="${f(T[1]+h*0.01)}" r="${f(h*0.03)}" fill="${lB}"/>`;
  return s;};
L.miniPalm=function(x,y,h,c,lean){return L.palm(x,y,h,{sil:c,lean:lean||h*0.12,fronds:[[-165,0.9,0.5],[-130,0.8,0.15],[-95,0.6,0.02],[-60,0.75,0.1],[-20,0.9,0.4],[5,0.8,0.7]],fw:0.09});};
/* a row of distant palm silhouettes along a ridge */
L.palmRow=function(pts,x0,x1,h,c,seed,gap){const r=L.rng(seed||7);let s='';for(let x=x0;x<x1;x+=(gap||36)*(0.75+0.5*r())){s+=L.miniPalm(x,L.yAt(pts,x)+3,h*(0.8+0.4*r()),c,h*(0.05+0.15*r())*(r()<0.5?-1:1));}return s;};

/* round shrub cluster (2-tone circles) */
L.bush=function(x,y,s,cL,cD,seed){const r=L.rng(seed||3);let a='',b='';const n=5;
  for(let i=0;i<n;i++){const u=i/(n-1)-0.5;const cx=x+u*s*1.6+(r()-0.5)*s*0.2,rr=s*(0.42+0.25*Math.cos(u*2.6))*(0.85+0.3*r()),cy=y-rr*0.75;
    a+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rr)}"/>`;b+=`<circle cx="${f(cx-rr*0.18)}" cy="${f(cy-rr*0.2)}" r="${f(rr*0.8)}"/>`;}
  return `<g fill="${cD}">${a}</g><g fill="${cL}">${b}</g>`;};
/* round-canopy tree (olive / eucalyptus / street tree) */
L.tree=function(x,y,h,cL,cD,o){o=o||{};const tc=o.trunk||'#232B6C';let s=`<path d="${L.taper([x,y],[x,y-h*0.3],[x+(o.lean||0)*0.5,y-h*0.55],[x+(o.lean||0),y-h*0.68],h*0.07,h*0.035,10)}" fill="${tc}"/>`;
  s+=L.bush(x+(o.lean||0),y-h*0.5,h*0.36,cL,cD,o.seed||5);return s;};
/* fan of big two-tone leaves (foreground tropical plant) */
L.leafFan=function(x,y,len,angs,wid,cL,cD){let s='';for(let i=0;i<angs.length;i++){const a=angs[i];s+=L.frond([x,y],a,len*(0.82+0.18*Math.sin(i*2.1+1)),0.06,wid,cL,cD,false);}return s;};
L.birds=function(list,c){let d='';for(const b of list){const[x,y,s]=b;d+=`M${f(x-s)} ${f(y-s*0.35)}Q${f(x-s*0.45)} ${f(y-s*0.55)} ${f(x)} ${f(y)}Q${f(x+s*0.45)} ${f(y-s*0.55)} ${f(x+s)} ${f(y-s*0.35)}`;}return `<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;};
L.sprig=function(x,y,len,ang,c,cs,seed,leaf){const a=ang*Math.PI/180;const E=[x+Math.cos(a)*len,y+Math.sin(a)*len];const C=[x+Math.cos(a)*len*0.5+len*0.18*Math.sign(Math.cos(a)||1),y+Math.sin(a)*len*0.5];
  let s=`<path d="M${f(x)} ${f(y)}Q${f(C[0])} ${f(C[1])} ${f(E[0])} ${f(E[1])}" fill="none" stroke="${cs||c}" stroke-width="${f(len*0.02+1)}" stroke-linecap="round"/>`;
  const n=7;const lw=leaf||len*0.16;
  for(let i=1;i<=n;i++){const t=i/(n+1),u=1-t;const px=u*u*x+2*u*t*C[0]+t*t*E[0],py=u*u*y+2*u*t*C[1]+t*t*E[1];const tx=2*u*(C[0]-x)+2*t*(E[0]-C[0]),ty=2*u*(C[1]-y)+2*t*(E[1]-C[1]);const da=Math.atan2(ty,tx)*180/Math.PI;
    for(const sd of[-1,1]){const rot=da+sd*48;const L2=lw*(1-t*0.55);const ex=px+Math.cos(rot*Math.PI/180)*L2*0.55,ey=py+Math.sin(rot*Math.PI/180)*L2*0.55;s+=`<ellipse cx="${f(ex)}" cy="${f(ey)}" rx="${f(L2*0.55)}" ry="${f(L2*0.2)}" transform="rotate(${f(rot)} ${f(ex)} ${f(ey)})" fill="${c}"/>`;}}
  s+=`<ellipse cx="${f(E[0])}" cy="${f(E[1])}" rx="${f(lw*0.4)}" ry="${f(lw*0.16)}" transform="rotate(${f(ang)} ${f(E[0])} ${f(E[1])})" fill="${c}"/>`;
  return s;};
L.flower=function(x,y,r,c,cc){let s='';for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2;s+=`<circle cx="${f(x+Math.cos(a)*r*0.62)}" cy="${f(y+Math.sin(a)*r*0.62)}" r="${f(r*0.5)}" fill="${c}"/>`;}return s+`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r*0.32)}" fill="${cc||'#F6C9D9'}"/>`;};
/* the standard dark foreground strip: navy ridge + plants (keeps the corner logo on navy) */
L.fgStrip=function(o){const D=L.layer(Object.assign({y:950,amp:16,freq:0.006,seed:51,c0:'#1E2556',c1:'#2C3679',gy0:900,gy1:1080},o));return D;};

/* water: ONE shared gradient per scene (userSpaceOnUse) so bands have no seams */
L.waterGrad=function(y0,stops){return L.lin(stops||[[0,'#EADFF5'],[0.18,'#D3DBF6'],[0.5,'#AAC6F0'],[1,'#7DA6E5']],0,y0,0,1080);};
L.water=function(W,y,seed,n,x0,x1,op){return `<rect x="-480" y="${f(y)}" width="2880" height="${f(1300-y)}" fill="${W}"/>`+(n?L.glints(x0!=null?x0:-100,x1!=null?x1:2000,y+6,y+90,n,seed,'#FFFFFF',op||0.55):'');};
L.glints=function(x0,x1,y0,y1,n,seed,c,op){const r=L.rng(seed);let d='';for(let i=0;i<n;i++){const y=y0+(y1-y0)*Math.pow(r(),0.8);const k=(y-y0)/(y1-y0+1e-6);const len=12+60*k+r()*40*k;const x=x0+(x1-x0)*r();d+=`M${f(x)} ${f(y)}h${f(len)}`;}
  return `<path d="${d}" stroke="${c||'#FFFFFF'}" stroke-opacity="${op||0.6}" stroke-width="3" stroke-linecap="round"/>`;};

/* Nile felucca: navy hull, tall lateen sail with lilac shade, soft reflection */
L.felucca=function(x,y,s,o){o=o||{};const fl=o.flip?-1:1;const X=v=>x+v*s*fl;const Y=v=>y+v*s;
  const hull=`M${f(X(-0.62))} ${f(Y(-0.06))}Q${f(X(-0.3))} ${f(Y(0.12))} ${f(X(0.2))} ${f(Y(0.11))}Q${f(X(0.5))} ${f(Y(0.08))} ${f(X(0.66))} ${f(Y(-0.1))}Z`;
  const sail=`M${f(X(-0.5))} ${f(Y(-0.11))}L${f(X(0.42))} ${f(Y(-1.32))}Q${f(X(0.62))} ${f(Y(-0.6))} ${f(X(0.48))} ${f(Y(-0.12))}Z`;

L.dome=function(x,y,r,c){const yd=y-r*0.55;return `<g fill="${c}"><rect x="${f(x-r*1.05)}" y="${f(yd)}" width="${f(r*2.1)}" height="${f(r*0.56)}"/><rect x="${f(x-r*1.12)}" y="${f(yd-r*0.08)}" width="${f(r*2.24)}" height="${f(r*0.1)}"/>

/* Cairo Tower — red lattice shaft, navy lotus crown, white deck */
L.cairoTower=function(x,y,H,o){o=o||{};const red=o.red||'#E5323B',redL=o.redL||'#F2646A',redD=o.redD||'#B4232D',navy=o.navy||'#1B2350',navyL=o.navyL||'#2E3B82',wh='#FFFFFF';

/* Cairo Tower silhouette (single colour, for hazy skylines) */
L.towerSil=function(x,y,H,c){const w0=H*0.05,w1=H*0.04,yS=y-H*0.66,yL=y-H*0.76,lw=H*0.105,yD=y-H*0.82,dw=H*0.098;

L.turbine=function(x,y,h,c,cs){c=c||'#FFFFFF';cs=cs||'#D6DCF4';const hub=[x,y-h];const tw0=h*0.035,tw1=h*0.016;

L.lighthouse=function(x,y,h,o){o=o||{};const red=o.red||'#E5323B',navy=o.navy||'#1B2350',wh='#FFFFFF';const w0=h*0.11,w1=h*0.07;const yT=y-h*0.78;let s='';

/* ---------- city & coast ---------- */
/* apartment block: o={c (wall), cs (shade side), win, rows, cols, bal (balcony colour), roof (tanks/dishes), shade (0..1 width of shaded side)} */
L.block=function(x,y,w,h,o){o=o||{};const c=o.c||'#E9ECFA',cs=o.cs||L.mix(c,'#6475C9',0.22),wc=o.win||'#6475C9';let s=`<rect x="${f(x)}" y="${f(y-h)}" width="${f(w)}" height="${f(h+2)}" fill="${c}"/>`;
  const sw=w*(o.shade!=null?o.shade:0.22);s+=`<rect x="${f(x+w-sw)}" y="${f(y-h)}" width="${f(sw)}" height="${f(h+2)}" fill="${cs}"/>`;
  s+=`<rect x="${f(x-3)}" y="${f(y-h-6)}" width="${f(w+6)}" height="6" fill="${o.cap||cs}"/>`;
  const rows=o.rows||Math.max(2,Math.floor(h/46)),cols=o.cols||Math.max(2,Math.floor(w/40));const gx=w/cols,gy=(h-20)/rows;let d='';
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const wx=x+gx*(j+0.28),wy=y-h+14+gy*i;d+=`M${f(wx)} ${f(wy)}h${f(gx*0.44)}v${f(gy*0.5)}h${f(-gx*0.44)}Z`;}

  if(o.bal){let b='';for(let i=1;i<rows;i+=2)b+=`<rect x="${f(x+gx*0.12)}" y="${f(y-h+14+gy*i+gy*0.52)}" width="${f(w*0.5)}" height="${f(gy*0.14)}"/>`;s+=`<g fill="${o.bal}">${b}</g>`;}
  if(o.roof){const r=L.rng(o.seed||x|0);for(let i=0;i<o.roof;i++){const rx=x+w*(0.15+0.7*r());if(r()<0.55)s+=L.tank(rx,y-h-6,14+6*r(),o.tank||cs);else s+=L.dish(rx,y-h-6,14,o.tank||cs);}}
  return s;};
L.tank=function(x,y,r,c){return `<g fill="${c}"><rect x="${f(x-r)}" y="${f(y-r*1.6)}" width="${f(r*2)}" height="${f(r*1.6)}"/><ellipse cx="${f(x)}" cy="${f(y-r*1.6)}" rx="${f(r)}" ry="${f(r*0.35)}"/><rect x="${f(x-r*0.8)}" y="${f(y-r*0.2)}" width="${f(r*0.25)}" height="${f(r*0.2+1)}"/><rect x="${f(x+r*0.55)}" y="${f(y-r*0.2)}" width="${f(r*0.25)}" height="${f(r*0.2+1)}"/></g>`;};
L.dish=function(x,y,r,c){return `<g fill="${c}"><path d="M${f(x-r)} ${f(y-r*1.4)}A${f(r)} ${f(r*0.6)} -30 0 0 ${f(x+r*0.7)} ${f(y-r*0.4)}Z"/><rect x="${f(x-1.5)}" y="${f(y-r*0.9)}" width="3" height="${f(r*0.9)}"/></g>`;};
/* a city skyline band of blocks between x0..x1 sitting on y (seeded) */
L.city=function(x0,x1,y,o){o=o||{};const r=L.rng(o.seed||9);let s='';let x=x0;while(x<x1){const w=(o.w||70)*(0.7+0.7*r()),h=(o.h||120)*(0.55+0.9*r());
  if(o.sil)s+=`<rect x="${f(x)}" y="${f(y-h)}" width="${f(w-4)}" height="${f(h+40)}" fill="${o.sil}"/>`;
  else{const cols=o.cols||['#E9ECFA','#D7DDF7','#F3E3EE','#C9D1F2'];s+=L.block(x,y,w-6,h,{c:cols[Math.floor(r()*cols.length)],win:o.win,winOp:o.winOp,roof:o.roof?1+Math.floor(r()*2):0,seed:Math.floor(r()*999),tank:o.tank,bal:o.bal});}
  x+=w+(o.gap||0);}return s;};
/* Qaitbay citadel (Alexandria): keep with corner towers + crenellated wall + small minaret */
L.qaitbay=function(x,y,s,c,cl){cl=cl||L.mix(c,'#FFFFFF',0.25);const S=v=>f(v*s);let q='';
  const cren=(x0,x1,yy,h,col)=>{let d='';for(let xx=x0;xx<x1-h*0.5;xx+=h*1.6)d+=`<rect x="${f(xx)}" y="${f(yy-h)}" width="${f(h*0.9)}" height="${f(h+1)}"/>`;return `<g fill="${col}">${d}</g>`;};
  q+=`<rect x="${f(x-s*1.0)}" y="${f(y-s*0.22)}" width="${S(2.0)}" height="${S(0.24)}" fill="${c}"/>`+cren(x-s*1.0,x+s*1.0,y-s*0.22,s*0.05,c);
  for(const k of[-1,1])q+=`<rect x="${f(x+k*s*1.0-s*0.07)}" y="${f(y-s*0.3)}" width="${S(0.14)}" height="${S(0.3)}" rx="${S(0.03)}" fill="${c}"/>`;
  q+=`<rect x="${f(x-s*0.42)}" y="${f(y-s*0.66)}" width="${S(0.84)}" height="${S(0.5)}" fill="${c}"/><rect x="${f(x+s*0.12)}" y="${f(y-s*0.66)}" width="${S(0.3)}" height="${S(0.5)}" fill="${cl}" opacity=".55"/>`;
  q+=cren(x-s*0.42,x+s*0.42,y-s*0.66,s*0.045,c);
  for(const k of[-1,1])q+=`<rect x="${f(x+k*s*0.42-s*0.08)}" y="${f(y-s*0.76)}" width="${S(0.16)}" height="${S(0.6)}" rx="${S(0.04)}" fill="${c}"/><path d="M${f(x+k*s*0.42-s*0.09)} ${f(y-s*0.76)}h${S(0.18)}l${S(-0.09)} ${S(-0.08)}Z" fill="${c}"/>`;
  q+=`<rect x="${f(x-s*0.035)}" y="${f(y-s*0.98)}" width="${S(0.07)}" height="${S(0.34)}" fill="${c}"/><path d="M${f(x-s*0.05)} ${f(y-s*0.98)}h${S(0.1)}l${S(-0.05)} ${S(-0.09)}Z" fill="${c}"/>`;
  let wd='';for(let i=0;i<3;i++)wd+=`M${f(x-s*0.24+i*s*0.24-s*0.025)} ${f(y-s*0.5)}h${S(0.05)}v${S(0.09)}h${S(-0.05)}Z`;q+=`<path d="${wd}" fill="${L.mix(c,'#1B2350',0.35)}"/>`;
  return q;};
/* Stanley bridge: deck with arches + four domed towers */
L.stanley=function(x0,x1,y,c,cs){cs=cs||L.mix(c,'#1B2350',0.25);const w=x1-x0;let s=`<rect x="${f(x0)}" y="${f(y-14)}" width="${f(w)}" height="16" fill="${c}"/><rect x="${f(x0)}" y="${f(y-20)}" width="${f(w)}" height="6" fill="${cs}"/>`;

  for(const k of[0.18,0.38,0.62,0.82]){const tx=x0+w*k;s+=`<rect x="${f(tx-14)}" y="${f(y-74)}" width="28" height="56" fill="${c}"/><path d="M${f(tx-16)} ${f(y-74)}Q${f(tx)} ${f(y-104)} ${f(tx+16)} ${f(y-74)}Z" fill="${c}"/><rect x="${f(tx-1.5)}" y="${f(y-112)}" width="3" height="12" fill="${c}"/><rect x="${f(tx+3)}" y="${f(y-74)}" width="11" height="56" fill="${cs}" opacity=".5"/>`;}
  return s;};
L.lamp=function(x,y,h,c,glow){c=c||'#1B2350';let s=`<rect x="${f(x-2.5)}" y="${f(y-h)}" width="5" height="${f(h)}" fill="${c}"/><rect x="${f(x-7)}" y="${f(y-10)}" width="14" height="10" fill="${c}"/><path d="M${f(x)} ${f(y-h)}q0 -16 18 -16" fill="none" stroke="${c}" stroke-width="4"/><path d="M${f(x+10)} ${f(y-h-18)}h20l-4 9h-12Z" fill="${c}"/>`;
  if(glow)s+=`<circle cx="${f(x+20)}" cy="${f(y-h-6)}" r="6" fill="${glow}"/>`;return s;};
L.rail=function(x0,x1,y,c,h){h=h||26;let d=`M${f(x0)} ${f(y-h)}H${f(x1)}`;for(let x=x0;x<=x1;x+=18)d+=`M${f(x)} ${f(y-h)}V${f(y)}`;return `<path d="${d}" stroke="${c}" stroke-width="3" fill="none"/><rect x="${f(x0)}" y="${f(y-h-4)}" width="${f(x1-x0)}" height="5" fill="${c}"/>`;};

/* ---------- port ---------- */
L.box=function(x,y,w,h,c,o){o=o||{};const cs=o.cs||L.mix(c,'#1B2350',0.22);let s=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${c}"/><rect x="${f(x+w*0.8)}" y="${f(y)}" width="${f(w*0.2)}" height="${f(h)}" fill="${cs}"/>`;
  let d='';const n=Math.max(3,Math.floor(w/9));for(let i=1;i<n;i++){d+=`M${f(x+w*i/n)} ${f(y+h*0.12)}V${f(y+h*0.88)}`;}
  s+=`<path d="${d}" stroke="${cs}" stroke-width="${f(Math.max(1,w*0.02))}" opacity=".5"/><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.max(1.5,h*0.08))}" fill="#FFFFFF" opacity=".25"/>`;return s;};
/* ship-to-shore gantry crane, boom pointing toward -x (water) */
L.crane=function(x,y,h,o){o=o||{};const c=o.c||'#2E3B82',c2=o.c2||'#FFFFFF',acc=o.acc||'#E5323B';const w=h*0.42;let s='';
  const leg=(lx)=>`<path d="M${f(lx-h*0.018)} ${f(y)}L${f(lx-h*0.012)} ${f(y-h*0.62)}L${f(lx+h*0.012)} ${f(y-h*0.62)}L${f(lx+h*0.018)} ${f(y)}Z" fill="${c}"/>`;
  s+=leg(x-w/2)+leg(x+w/2);
  s+=`<rect x="${f(x-w/2)}" y="${f(y-h*0.3)}" width="${f(w)}" height="${f(h*0.03)}" fill="${c}"/><path d="M${f(x-w/2)} ${f(y-h*0.3)}L${f(x+w/2)} ${f(y-h*0.6)}M${f(x+w/2)} ${f(y-h*0.3)}L${f(x-w/2)} ${f(y-h*0.6)}" stroke="${c}" stroke-width="${f(h*0.01)}"/>`;
  const by=y-h*0.66;s+=`<rect x="${f(x-h*0.95)}" y="${f(by)}" width="${f(h*1.25)}" height="${f(h*0.045)}" fill="${c2}"/><rect x="${f(x-h*0.95)}" y="${f(by+h*0.03)}" width="${f(h*1.25)}" height="${f(h*0.015)}" fill="${c}"/>`;
  s+=`<path d="M${f(x-w/2)} ${f(y-h*0.62)}L${f(x-w*0.1)} ${f(y-h*0.98)}L${f(x+w/2)} ${f(y-h*0.62)}" fill="none" stroke="${c}" stroke-width="${f(h*0.018)}"/><path d="M${f(x-w*0.1)} ${f(y-h*0.98)}L${f(x-h*0.9)} ${f(by)}M${f(x-w*0.1)} ${f(y-h*0.98)}L${f(x+h*0.28)} ${f(by)}" stroke="${c}" stroke-width="${f(h*0.007)}"/>`;
  s+=`<rect x="${f(x+h*0.12)}" y="${f(by-h*0.07)}" width="${f(h*0.14)}" height="${f(h*0.07)}" fill="${c2}"/><rect x="${f(x+h*0.14)}" y="${f(by-h*0.055)}" width="${f(h*0.1)}" height="${f(h*0.025)}" fill="${c}" opacity=".7"/>`;

/* container ship (bow toward -x), deck rows of boxes; o.cols */
L.ship=function(x,y,len,o){o=o||{};const r=L.rng(o.seed||4);const nv=o.hull||'#1B2350',h=len*0.11;let s='';

  for(let k=0;k<3;k++)s+=`<rect x="${f(sx+len*0.01)}" y="${f(y-h-h*1.6+k*h*0.45)}" width="${f(len*0.08)}" height="${f(h*0.14)}" fill="${nv}" opacity=".8"/>`;
  s+=`<rect x="${f(sx+len*0.06)}" y="${f(y-h-h*2.5)}" width="${f(len*0.025)}" height="${f(h*0.6)}" fill="${nv}"/>`;

/* ---------- sea / reef ---------- */
L.fish=function(x,y,s,c,c2,flip){const k=flip?-1:1;return `<g transform="translate(${f(x)} ${f(y)}) scale(${f(s*k)} ${f(s)})"><path d="M-1 0Q-0.4 -0.55 0.45 -0.12L0.9 -0.42L0.82 0L0.9 0.42L0.45 0.12Q-0.4 0.55 -1 0Z" fill="${c}"/><path d="M-0.35 -0.4Q-0.25 0 -0.35 0.4" stroke="${c2||'#FFFFFF'}" stroke-width="0.12" fill="none"/><circle cx="-0.68" cy="-0.08" r="0.08" fill="#1B2350"/></g>`;};
L.coral=function(x,y,h,c,seed){const r=L.rng(seed||3);let s='';const br=(x0,y0,a,len,w,d)=>{const x1=x0+Math.cos(a)*len,y1=y0+Math.sin(a)*len;s+=`<path d="${L.taper([x0,y0],[x0+Math.cos(a)*len*0.33,y0+Math.sin(a)*len*0.33],[x1-Math.cos(a)*len*0.3,y1-Math.sin(a)*len*0.3],[x1,y1],w,w*0.72,6)}" fill="${c}"/><circle cx="${f(x1)}" cy="${f(y1)}" r="${f(w*0.38)}" fill="${c}"/>`;

L.brain=function(x,y,r,c,cs){let d='';for(let k=1;k<4;k++)d+=`M${f(x-r*k/4)} ${f(y)}A${f(r*k/4)} ${f(r*k/4*0.8)} 0 0 1 ${f(x+r*k/4)} ${f(y)}`;return `<path d="M${f(x-r)} ${f(y)}A${f(r)} ${f(r*0.8)} 0 0 1 ${f(x+r)} ${f(y)}Z" fill="${c}"/><path d="${d}" stroke="${cs}" stroke-width="3" fill="none"/>`;};

/* smart buoy (red/white float, solar panel, antenna, sensor pod below) — drawn at origin, waterline y=0 */

L.rays=function(x,y,n,len,c,seed){const r=L.rng(seed||2);let s='';for(let i=0;i<n;i++){const xx=x+i*(len*0.5)*(0.8+0.4*r()),w=30+40*r();s+=`<path d="M${f(xx)} ${f(y)}L${f(xx+w)} ${f(y)}L${f(xx+w*2.4+len*0.35)} ${f(y+len)}L${f(xx+len*0.35)} ${f(y+len)}Z" fill="${c}" opacity="${f(0.06+0.06*r())}"/>`;}return s;};

/* ---------- Aswan / Siwa / Delta ---------- */
/* Nubian house: rendered walls, rounded parapet, vaulted dome, painted arched door with triangle frieze */
L.nubian=function(x,y,w,h,o){o=o||{};const c=o.c||'#FFFFFF',cs=o.cs||L.mix(c,'#6475C9',0.2),door=o.door||'#2E9CCB',tr=o.trim||'#E5323B';let s='';
  s+=`<path d="M${f(x)} ${f(y)}V${f(y-h+8)}Q${f(x)} ${f(y-h)} ${f(x+8)} ${f(y-h)}H${f(x+w-8)}Q${f(x+w)} ${f(y-h)} ${f(x+w)} ${f(y-h+8)}V${f(y)}Z" fill="${c}"/>`;

/* ======================================================================================================================
