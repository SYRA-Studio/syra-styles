<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";src:url("fonts/montserrat-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2") format("woff2");font-weight:600;font-display:block}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2");font-weight:700;font-display:block}
html,body,#stage{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#17112E}
#stage{position:relative}
#art{position:absolute;left:0;top:0;width:1920px;height:1080px}
.block{position:absolute;left:1000px;width:800px;top:0;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.mask{overflow:hidden}
.ar{direction:rtl;font-family:"IBM Plex Sans Arabic",sans-serif;color:#FFF6EA;text-align:right;white-space:nowrap}
.en{direction:ltr;font-family:"Montserrat",sans-serif;color:#FFF6EA;text-align:right;white-space:nowrap}
#t-ar{font-weight:700;font-size:140px;line-height:1.5}
#t-en{font-weight:800;font-size:120px;line-height:1.15;letter-spacing:-1px;padding:6px 0 10px}
#n-num{font-weight:800;font-size:300px;line-height:1;color:#FFC247;letter-spacing:-6px;padding:10px 0 4px}
#n-ar{font-weight:600;font-size:100px;line-height:1.55}
#n-en{font-weight:600;font-size:64px;line-height:1.3;padding:2px 0 6px}
#num-block{gap:0}
</style></head>
<body>
<div id="stage" data-composition-id="sample" data-start="0" data-duration="5" data-fps="30" data-width="1920" data-height="1080">
  <svg id="art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <circle id="ghost" cx="540" cy="540" r="235" fill="none" stroke="#3D3070" stroke-width="3" opacity="0"/>
    <path id="sat0s" fill="#000"/><path id="sat1s" fill="#000"/><path id="sat2s" fill="#000"/>
    <path id="sat0" /><path id="sat1" /><path id="sat2" />
    <path id="echo2" fill="none" stroke="#8F7FE0" stroke-width="3" stroke-linejoin="round" opacity="0"/>
    <path id="echo1" fill="none" stroke="#8F7FE0" stroke-width="3" stroke-linejoin="round" opacity="0"/>
    <path id="wedge-s" stroke-linejoin="round"/>
    <path id="wedge" stroke-linejoin="round"/>
    <path id="hero-s" stroke-linejoin="round"/>
    <path id="hero" stroke-linejoin="round"/>
  </svg>

  <div class="block" id="title-block">
    <div class="mask" data-layout-allow-overflow><div class="ar" id="t-ar" dir="rtl">مدينة ذكية</div></div>
    <div class="mask" data-layout-allow-overflow><div class="en" id="t-en" dir="ltr">Smart City</div></div>
  </div>

  <div class="block" id="num-block">
    <div class="mask" data-layout-allow-overflow><div class="en" id="n-num" dir="ltr">0%</div></div>
    <div class="mask" data-layout-allow-overflow><div class="ar" id="n-ar" dir="rtl">طاقة أقل</div></div>
    <div class="mask" data-layout-allow-overflow><div class="en" id="n-en" dir="ltr">less energy</div></div>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script>
  (function () {
    var N = 160, M = 48, D2R = Math.PI / 180;
    var CX = 540, CY = 540, R = 235;
    function hex(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
    function mix(a,b,t){ return "rgb("+Math.round(a[0]+(b[0]-a[0])*t)+","+Math.round(a[1]+(b[1]-a[1])*t)+","+Math.round(a[2]+(b[2]-a[2])*t)+")"; }
    function clamp(v){ return v<0?0:v>1?1:v; }
    function polar(r,deg){ var a=deg*D2R; return [r*Math.sin(a), -r*Math.cos(a)]; }  // degrees clockwise from up

    // sample a closed outline into n points equally spaced along its length, from its first point, in its own direction
    function resample(pts, n){
      var L=[0], i, tot=0;
      for(i=0;i<pts.length;i++){ var p=pts[i], q=pts[(i+1)%pts.length]; tot+=Math.hypot(q[0]-p[0],q[1]-p[1]); L.push(tot); }
      var out=[], seg=0;
      for(var k=0;k<n;k++){
        var d=k/n*tot;
        while(L[seg+1]<d) seg++;
        var p0=pts[seg], p1=pts[(seg+1)%pts.length], u=(d-L[seg])/((L[seg+1]-L[seg])||1);
        out.push([p0[0]+(p1[0]-p0[0])*u, p0[1]+(p1[1]-p0[1])*u]);
      }
      return out;
    }
    // sector with a fixed point layout: 90 on the arc, 35 on each straight edge (so a thin sliver opens cleanly)
    function sector(a0,a1,r){
      var out=[], i;
      for(i=0;i<90;i++) out.push(polar(r, a0+(a1-a0)*i/89));
      var e=out[89];
      for(i=1;i<=35;i++) out.push([e[0]*(1-i/35), e[1]*(1-i/35)]);
      var s=out[0];
      for(i=1;i<=35;i++) out.push([s[0]*(i/36), s[1]*(i/36)]);
      return out;
    }
    function disc(r){ var o=[]; for(var i=0;i<N;i++) o.push(polar(r,225+360*i/N)); return o; }
    function poly(v){ return resample(v,N); }

    var CORAL=hex("#FF5C47"), CORALD=hex("#C8372B"), SAFF=hex("#FFC247"), SAFFD=hex("#D9941C"), AQUA=hex("#35D6C4"), AQUAD=hex("#1E9C8F");

    var forms = {
      C0:{p:disc(R*0.999), f:CORAL, d:CORALD},
      H:{p:poly([[-200,200],[-200,-20],[0,-230],[200,-20],[200,200]]), f:SAFF, d:SAFFD},
      T:{p:poly([[-100,230],[-100,-40],[-40,-40],[-40,-120],[0,-250],[40,-120],[40,-40],[100,-40],[100,230]]), f:CORAL, d:CORALD},
      S:{p:poly([[-270,200],[-270,20],[-190,20],[-190,-80],[-100,-80],[-100,-200],[-10,-200],[-10,-40],[70,-40],[70,-120],[160,-120],[160,60],[270,60],[270,200]]), f:SAFF, d:SAFFD},
      D:{p:disc(R), f:CORAL, d:CORALD},
      P:{p:sector(225,441,R), f:CORAL, d:CORALD},
      W0:{p:sector(81,83,R), f:SAFF, d:SAFFD},
      W1:{p:sector(81,225,R), f:SAFF, d:SAFFD}
    };
    var heroSegs = [
      {a:"C0",b:"H",start:0.60,dur:0.50},
      {a:"H",b:"T",start:1.15,dur:0.50},
      {a:"T",b:"S",start:1.70,dur:0.50},
      {a:"S",b:"D",start:2.35,dur:0.55},
      {a:"D",b:"P",start:3.15,dur:0.65}
    ];
    var wedgeSegs = [{a:"W0",b:"W1",start:3.15,dur:0.65}];
    var eInOut = gsap.parseEase("power3.inOut"), eOut = gsap.parseEase("power3.out"), eBack = gsap.parseEase("back.out(1.4)");

    function formAt(segs, time){
      var s=null, i;
      for(i=0;i<segs.length;i++) if(segs[i].start<=time) s=segs[i];
      if(!s){ var f=forms[segs[0].a]; return {p:f.p, f:mix(f.f,f.f,0), d:mix(f.d,f.d,0)}; }
      var t=clamp((time-s.start)/s.dur), e=eInOut(t), A=forms[s.a], B=forms[s.b], p=[];
      for(i=0;i<A.p.length;i++) p.push([A.p[i][0]+(B.p[i][0]-A.p[i][0])*e, A.p[i][1]+(B.p[i][1]-A.p[i][1])*e]);
      return {p:p, f:mix(A.f,B.f,e), d:mix(A.d,B.d,e)};
    }
    function pathOf(p, sc, ox, oy){
      var s="M", i;
      for(i=0;i<p.length;i++) s+=(i?"L":"")+(ox+p[i][0]*sc).toFixed(1)+" "+(oy+p[i][1]*sc).toFixed(1);
      return s+"Z";
    }
    function motion(a,b){ var d=0; for(var i=0;i<a.length;i++) d+=Math.hypot(a[i][0]-b[i][0],a[i][1]-b[i][1]); return d/a.length; }
    function $(id){ return document.getElementById(id); }
    var heroEl=$("hero"), heroS=$("hero-s"), e1=$("echo1"), e2=$("echo2"), wEl=$("wedge"), wS=$("wedge-s"), ghost=$("ghost"), numEl=$("n-num");

    // small satellites: 48-point forms, all starting at the top vertex, clockwise
    function reg(n,r){ var v=[]; for(var i=0;i<n;i++){ var a=(-90+360*i/n)*D2R; v.push([r*Math.cos(a), r*Math.sin(a)]); } return resample(v,M); }
    var sf = { tri:reg(3,1.15), dia:reg(4,1.0), pen:reg(5,1.0), cir:reg(48,0.92) };
    var sats = [
      {id:"sat0", x:215, y:190, r:46, ph:0, delay:0.30, forms:["tri","dia","cir"], col:[AQUA,SAFF,AQUA], deep:[AQUAD,SAFFD,AQUAD], t:[1.00,2.70]},
      {id:"sat1", x:900, y:200, r:42, ph:2, delay:0.45, forms:["dia","cir","pen"], col:[SAFF,AQUA,SAFF], deep:[SAFFD,AQUAD,SAFFD], t:[1.50,3.30]},
      {id:"sat2", x:225, y:900, r:40, ph:4, delay:0.60, forms:["cir","tri","dia"], col:[AQUA,AQUA,SAFF], deep:[AQUAD,AQUAD,SAFFD], t:[1.90,3.60]}
    ];
    function drawSat(s, time){
      var el=$(s.id), sh=$(s.id+"s"), g=clamp((time-s.delay)/0.5), sc=s.r*eBack(g);
      var seg=0; if(time>=s.t[0]) seg=1; if(time>=s.t[1]) seg=2;
      var A,B,t=0;
      if(seg===0){ A=0;B=0; }
      else { A=seg-1; B=seg; t=eInOut(clamp((time-s.t[seg-1])/0.55)); }
      var pa=sf[s.forms[A]], pb=sf[s.forms[B]], p=[], rot=(time*22+s.ph*40)*D2R, c=Math.cos(rot), sn=Math.sin(rot);
      for(var i=0;i<M;i++){
        var x=pa[i][0]+(pb[i][0]-pa[i][0])*t, y=pa[i][1]+(pb[i][1]-pa[i][1])*t;
        p.push([x*c-y*sn, x*sn+y*c]);
      }
      var bx=s.x+Math.sin(time*1.3+s.ph)*9, by=s.y+Math.cos(time*1.0+s.ph)*12;
      el.setAttribute("d", g<=0?"":pathOf(p,sc,bx,by));
      sh.setAttribute("d", g<=0?"":pathOf(p,sc,bx+7,by+9));
      el.setAttribute("fill", mix(s.col[A],s.col[B],t));
      sh.setAttribute("fill", mix(s.deep[A],s.deep[B],t));
    }

    function draw(time){
      var g=clamp(time/0.55), sc=g<=0?0.0001:eBack(g);
      var h=formAt(heroSegs,time);
      heroEl.setAttribute("d", pathOf(h.p,sc,CX,CY));  heroEl.setAttribute("fill",mix(h.f,h.f,0));
      heroS.setAttribute("d", pathOf(h.p,sc,CX+14,CY+18)); heroS.setAttribute("fill",h.d);
      heroEl.setAttribute("fill", h.f);
      var lags=[0.09,0.18], els=[e1,e2];
      for(var k=0;k<2;k++){
        var tt=Math.max(0,time-lags[k]), h2=formAt(heroSegs,tt), sc2=eBack(clamp(tt/0.55)) || 0.0001;
        var mv=motion(h.p.map(function(q){return [q[0]*sc,q[1]*sc];}), h2.p.map(function(q){return [q[0]*sc2,q[1]*sc2];}));
        els[k].setAttribute("d", pathOf(h2.p,sc2,CX,CY));
        els[k].setAttribute("opacity", Math.min(0.55, mv/55*0.55)*(k?0.7:1));
      }
      // the 40% wedge
      if(time>=3.1){
        var w=formAt(wedgeSegs,time), o=56*eOut(clamp((time-3.55)/0.6)), a=153*D2R;
        var wx=CX+Math.sin(a)*o, wy=CY-Math.cos(a)*o;
        wEl.setAttribute("d", pathOf(w.p,1,wx,wy)); wEl.setAttribute("fill", w.f);
        wS.setAttribute("d", pathOf(w.p,1,wx+14,wy+18)); wS.setAttribute("fill", w.d);
      } else { wEl.setAttribute("d",""); wS.setAttribute("d",""); }
      ghost.setAttribute("opacity", clamp((time-3.2)/0.4));
      for(var i=0;i<sats.length;i++) drawSat(sats[i], time);
      // the figure counts up from the same clock
      numEl.textContent = Math.round(40*gsap.parseEase("power2.inOut")(clamp((time-2.65)/1.3))) + "%";
    }

    var tl = gsap.timeline({ paused: true });
    var clock = { time: 0 };
    tl.to(clock, { time: 5, duration: 5, ease: "none", onUpdate: function(){ draw(clock.time); } }, 0);

    // title in, out
    tl.fromTo("#t-ar", { yPercent: 115 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 0.15);
    tl.fromTo("#t-en", { yPercent: 115 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 0.27);
    tl.to("#t-ar", { yPercent: -115, duration: 0.3, ease: "power2.in" }, 2.2);
    tl.to("#t-en", { yPercent: -115, duration: 0.3, ease: "power2.in" }, 2.3);
    // number in
    tl.fromTo("#n-num", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 2.5);
    tl.fromTo("#n-ar", { yPercent: 115 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 2.75);
    tl.fromTo("#n-en", { yPercent: 115 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 2.87);
    tl.set({}, {}, 5);

    draw(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["sample"] = tl;
  })();
  </script>
</div>
</body></html>
