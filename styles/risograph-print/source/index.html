<script>
(function () {
  var tl = window.gsap.timeline({ paused: true });
  var OVERLAP = 0.7, TOTAL = 64.7;

  // ===== s01 : Title: Make your mark (approved frame 1) =====
  (function (T, D) {

  K.scene("s01", T, D, {
    draw: function (P, lt) {
      var R = K.R, w = K.win, e;
      // ---- yellow sun: solid core + halftone falloff, grows in then breathes
      var sk = .82 + .18 * K.pop(lt, .45, .7, 1.6), sx = 1330, sy = 470, sr = 330 * (.5 + .5 * sk) * (1 + .012 * Math.sin(lt * 2.2));
      if (sk > .01) P.fill(R.circle(sx, sy, sr), { y: R.rad(sx - 80, sy - 90, 0, sx, sy, sr, [[0, 1], [.55, .92], [1, .38]]) });
      // ---- rainbow arcs bottom-left (cut paper), bands cut in one after another
      var ax = 300, ay = 1100, k1 = .45 + .55 * R.backOut(w(lt, .45, .6), 1.2), k2 = .3 + .7 * R.backOut(w(lt, .55, .6), 1.2), k3 = .2 + .8 * R.backOut(w(lt, .65, .6), 1.2);
      var A0 = Math.PI, A1 = function (k) { return Math.PI + Math.PI * K.clamp(k, 0, 1.05); };
      if (k1 > 0) P.fill(R.arcBand(ax, ay, 110, 185, A0, A1(k1)), { p: 1 });
      if (k2 > 0) P.fill(R.arcBand(ax, ay, 205, 280, A0, A1(k2)), { b: .55 });
      if (k3 > 0) P.fill(R.arcBand(ax, ay, 300, 375, A0, A1(k3)), { y: 1 });
      if (lt > 1.0) P.over(R.arcBand(ax, ay, 170, 255, Math.PI * 1.55, Math.PI * (1.55 + .25 * R.easeOut(w(lt, 1.0, .4)))), { p: 1 });
      // ---- blue starburst overlapping the sun's edge (blue over yellow = green), turning
      var bk = K.pop(lt, .75, .45, 2.2);
      if (bk > .01) {
        P.over(R.star(1010, 250, 80 * bk, 122 * bk, 14, lt * .5), { b: 1 });
        P.over({ text: 'NEW!', font: K.EN(50), x: 1010, y: 268, align: 'center', spacing: 1 }, { b: 0, p: 0, y: 0 }, { transform: K.tf(1010, 250, bk, Math.sin(lt * 2) * .04) });
      }
      // ---- squiggle, confetti, overprinted squares
