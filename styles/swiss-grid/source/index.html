<style>
/* ===================== SWISS GRID — shared look (SYRA motion library style 26) ===================== */
:root{ --paper:#F5F6F7; --ink:#111111; --red:#E3242B; --grey:#6B6F76; --mod:#D9DCE0; --dimd:#9A9EA5; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#F5F6F7}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F5F6F7;color:#111;font-family:'Inter','IBM Plex Sans Arabic',sans-serif;font-feature-settings:'tnum' 1}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink)}
.scene.dark{background:var(--ink);color:var(--paper)}
.sw-svg{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.sw-lay{position:absolute;left:0;top:0;width:1920px;height:1080px}
.sw-lay > *{position:absolute}
.ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;unicode-bidi:isolate}
.en{font-family:'Inter',sans-serif;direction:ltr}
.mask{position:absolute;overflow:hidden}
.mask > div{position:absolute;white-space:nowrap}
.red{color:var(--red)}
/* type scale: 18 caption · 28 reading · 54 sub · 118–150 headline · 290–430 display */
.meta{top:28px;font:500 18px/1.25 'Inter';letter-spacing:-.005em;white-space:nowrap}
.meta.dim{color:var(--grey)} .dark .meta.dim{color:var(--dimd)}
.lbl{font:500 18px/1.3 'Inter';letter-spacing:-.005em;white-space:nowrap}
.lbl.b{font-weight:700}
.lbl.dim{color:var(--grey)} .dark .lbl.dim{color:var(--dimd)}
.lbl-ar{font:600 22px/1.45 'IBM Plex Sans Arabic';direction:rtl;white-space:nowrap}
.h-ar{font-family:'IBM Plex Sans Arabic';font-weight:700;white-space:nowrap}
.h-en{font-family:'Inter';font-weight:800;letter-spacing:-.05em;white-space:nowrap}
.sub-en{font:700 54px/1.05 'Inter';letter-spacing:-.03em;white-space:nowrap}
.sub-ar{font:700 50px/1.3 'IBM Plex Sans Arabic';white-space:nowrap;direction:rtl}
.read-en{font:400 28px/1.35 'Inter';letter-spacing:-.01em;white-space:nowrap}
.read-ar{font:500 30px/1.55 'IBM Plex Sans Arabic';white-space:nowrap;direction:rtl}
.num{font-family:'Inter';font-weight:800;letter-spacing:-.06em;white-space:nowrap;font-variant-numeric:tabular-nums}
.val{font:700 34px/1 'Inter';letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.td{font:500 30px/1 'Inter';letter-spacing:-.02em;white-space:nowrap}
/* ---------- stage-level layers ---------- */
#gs{left:0;top:0;width:1920px;height:1080px;z-index:50;pointer-events:none}
.gs-k{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
.gs-c{position:absolute;top:0;height:1080px;overflow:hidden}
.gs-i{position:absolute;top:0;width:1920px;height:1080px}
#gs-grid{left:0;top:0;width:1920px;height:1080px;z-index:60;pointer-events:none}
#gs-red{left:0;top:0;width:268px;height:268px;background:#E3242B;z-index:70;display:none}
#bug{right:58px;bottom:50px;width:222px;height:60px;z-index:1000}   /* SYRA corner logo: plain black on paper, plain white on ink */
#bug img{width:222px;height:60px;display:block}
/* ---- s01 ---- */

#s01 .s01-w{display:inline-block}

/* ---- s02 ---- */

#s02 .s02-ax{font:500 18px/1 'Inter';color:#6B6F76}
#s02 .s02-yr{font:500 22px/1 'Inter';letter-spacing:-.01em}
#s02 .s02-th{font:500 18px/1 'Inter';color:#6B6F76}

/* ---- s03 ---- */

#s03 .s03-key{display:flex;align-items:center;gap:10px}
#s03 .s03-key i{display:inline-block;width:18px;height:18px}

/* ---- s04 ---- */

#s04 .s04-ui{font-family:'Inter';color:#111;white-space:nowrap}
#s04 .s04-st{font:600 22px/1 'Inter';letter-spacing:-.01em;color:#111}
#s04 .s04-st.dim{color:#9A9EA5}
#s04 .s04-kv{font:800 64px/1 'Inter';letter-spacing:-.05em;color:#F5F6F7;font-variant-numeric:tabular-nums}
#s04 .s04-kl{font:500 18px/1.3 'Inter';color:#9A9EA5}

/* ---- s05 ---- */

#s05 .s05-n{font:700 22px/1 'Inter';letter-spacing:-.01em}

/* ---- s06 ---- */

#s06 .s06-r{font:700 22px/1.15 'Inter';letter-spacing:-.01em;color:#F5F6F7}
