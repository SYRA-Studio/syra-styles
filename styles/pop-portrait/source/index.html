<style>
/* ===================== POP PORTRAIT — shared look (library style 42; every scene uses these) ===================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#2B1E55;color:#fff;font-family:'Inter','IBM Plex Sans Arabic',sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#2B1E55}
.abs{position:absolute}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg.full{overflow:visible}
/* every scene: deep violet field with a soft lift (set --fx/--fy per scene to move the lift) */
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 75% 75% at var(--fx,58%) var(--fy,42%),#4A3787 0%,#3A2A6B 60%,#2B1E55 100%)}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
.ar{direction:rtl;unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate}
/* condensed display: Inter Black squeezed on whole words/lines (transform only; glyphs never split). The OUTER box is tweened,
   the inner .cond / .lz carries the squeeze. */
.cond{font-family:'Inter';font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.86;white-space:nowrap;transform:scaleX(.74);transform-origin:0 0;display:inline-block;vertical-align:top}
.en.r .cond,.cond.r{transform-origin:100% 0}
.lz{font-family:'Lalezar';direction:rtl;white-space:nowrap;line-height:1.05;display:inline-block;vertical-align:top;transform:scaleX(.9);transform-origin:100% 0}
.lz.c{transform-origin:50% 0}
.mint{color:#9FD9B8}.aqua{color:#7FD6D6}.pink{color:#FF2E7E}
.w{display:inline-block;font-style:normal}            /* one whole word (never letters) — tweenable inside a squeezed line */
.nav{position:absolute;top:58px;font:500 22px/1 'Inter';letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:#fff}
.nav b{font-weight:900}
.para{position:absolute;font:400 28px/1.42 'Inter';color:rgba(255,255,255,.84);letter-spacing:-.005em}
.body-ar{position:absolute;font:500 32px/1.6 'IBM Plex Sans Arabic','Inter';direction:rtl;color:rgba(255,255,255,.88);text-align:right;white-space:nowrap}
.kick{position:absolute;font:800 24px/1 'Inter';letter-spacing:.2em;text-transform:uppercase;color:#9FD9B8;white-space:nowrap}
.kick-ar{position:absolute;font:500 30px/1.2 'IBM Plex Sans Arabic','Inter';direction:rtl;color:#9FD9B8;white-space:nowrap}
.lbl{font:800 30px/1.1 'Inter';letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.cap{font:500 22px/1.2 'Inter';letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.66);white-space:nowrap}
.chip{position:absolute;font-family:'Lalezar';white-space:nowrap;line-height:1;padding:18px 28px 14px;border-radius:40px}
.chip{direction:rtl}
.chip.en{font-family:'Inter';font-weight:800;padding:18px 28px 16px;letter-spacing:.01em;direction:ltr}
.chip:after{content:'';position:absolute;width:26px;height:26px;background:inherit;transform:rotate(45deg);bottom:-9px}
.chip.s{background:#fff;color:#3A2A6B}.chip.m{background:#9FD9B8;color:#3A2A6B}
.chip.tr:after{right:42px}.chip.tl:after{left:42px}
.num{font-family:'Inter';font-weight:900;letter-spacing:-.02em;white-space:nowrap;line-height:.86;font-variant-numeric:tabular-nums}
/* ---------- stage-level layers ---------- */
#slam{left:0;top:0;width:1920px;height:1080px;z-index:90;pointer-events:none}
#fx{left:0;top:0;width:1920px;height:1080px;z-index:95;pointer-events:none}
#bug{right:58px;bottom:50px;width:222px;height:60px;z-index:1000}
#bug img{width:222px;height:60px;display:block}
/* ---- s01 ---- */

#s01-cta{left:100px;top:842px;display:flex;align-items:center;gap:18px}
#s01-cta .t{font:800 26px/1.15 'Inter';letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#s01-cta .t span{font-weight:500;opacity:.78;letter-spacing:.06em}

/* ---- s02 ---- */

#s02 .row{position:absolute;left:1010px;width:780px;height:92px}
#s02 .rk{position:absolute;left:0;top:10px;width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.9);font:900 28px/66px 'Inter';text-align:center;color:#fff}

   Stylised vector portraits in a hot-pink duotone (flat light + shade shapes, a few soft gradients, clean violet line
   work, aqua glass). Portraits are frontal, built from mirrored halves in local units (face centre 0,0; chin +196;
   crown about -260; garment bottom +660) and placed with one transform. v2 (kit): hair styles, beards, hats, garments,
   stethoscope, earrings, blink lids + iris groups for micro-life, and HANDS with forearm + sleeve (hand at the cheek,
   chin on a fist, thumbs-up, open palm, holding a phone, holding a mic). Pure in t; seeded randomness only. */
(function (global) {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const C = {
  VIOLET: '#3A2A6B', VIOLET_D: '#2A1D52', VIOLET_L: '#4C3A86', INK: '#24164A',
  PINK: '#FF2E7E', PINK_D: '#C2185B', PINK_DD: '#97104A', PINK_L: '#FF6FA3',
  SKIN: '#FFC2D3', SKIN_L: '#FFD9E3', SKIN_S: '#F48AAE', SKIN_D: '#DE5C8C', BLUSH: '#FF6F9C', LIP: '#E5135F',
  MINT: '#9FD9B8', MINT_D: '#6FBF98', AQUA: '#7FD6D6', AQUA_D: '#4FB9C4', WHITE: '#FFFFFF',
  COAT: '#F6F2FF', COAT_S: '#D9CFF2', COAT_D: '#B7A8E2',          // white garments: lavender shade, never grey-brown
  SILVER: '#ECE6FA', SILVER_S: '#C9BDEB', SILVER_D: '#A495D6',     // older hair: lavender silver
};
const P = { C };
P.rnd = function (seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
P.svg = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
P.el = (tag, attrs = {}, parent) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'style') e.style.cssText = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); } if (parent) parent.appendChild(e); return e; };
P.path = (g, d, fill, extra = {}) => P.svg('path', Object.assign({ d, fill }, extra), g);
let UID = 0; const uid = (p) => p + (++UID);
P.uid = uid;

P.sym = function (y0, segs, x0 = 0) {
  let d = `M ${x0} ${y0}`;
  segs.forEach(s => { d += ` C ${s[0]} ${s[1]} ${s[2]} ${s[3]} ${s[4]} ${s[5]}`; });
  const pts = [[x0, y0]].concat(segs.map(s => [s[4], s[5]]));
  for (let i = segs.length - 1; i >= 0; i--) { const s = segs[i], p = pts[i]; d += ` C ${-s[2]} ${s[3]} ${-s[0]} ${s[1]} ${-p[0]} ${p[1]}`; }
  return d + ' Z';
};
const mirrorD = (d) => d.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g, (m, x, y) => `${-parseFloat(x)} ${y}`);
P.mirrorD = mirrorD;
const f1 = (v) => Math.round(v * 10) / 10;

// capsule from base (x,y) of length len and width w, pointing at angle a (deg, 0 = up, + = clockwise)
function capsule(x, y, len, w, a) {
  const r = a * Math.PI / 180, ux = Math.sin(r), uy = -Math.cos(r), nx = Math.cos(r), ny = Math.sin(r), h = w / 2;
  const tx = x + ux * (len - h), ty = y + uy * (len - h);
  return `M ${f1(x - nx * h)} ${f1(y - ny * h)} L ${f1(tx - nx * h)} ${f1(ty - ny * h)} A ${h} ${h} 0 0 1 ${f1(tx + nx * h)} ${f1(ty + ny * h)} L ${f1(x + nx * h)} ${f1(y + ny * h)} Z`;
}
function along(x, y, d, a) { const r = a * Math.PI / 180; return [x + Math.sin(r) * d, y - Math.cos(r) * d]; }
P.capsule = capsule;

// ================= HANDS (hand-local units: wrist at 0,0, fingers up = -y; ~250 units wrist -> fingertip) =================
// paint: { skin, skinS, line, nail, sil }  — sil = flat silhouette colour (used for the contact shadow), no lines
function handOpen(g, k, palmSide, thumbIn) {
  const sil = k.sil, F = sil || k.skin, L = sil ? 'none' : k.line, lw = sil ? 0 : 3.6;
  const fingers = palmSide ? [[-44, -94, 90, 25, -13], [-16, -102, 114, 28, -4], [14, -104, 126, 29, 2], [42, -98, 113, 28, 9]]
    : [[-42, -92, 86, 26, -7], [-15, -100, 110, 28, -2.5], [13, -102, 122, 29, 1], [40, -96, 110, 28, 4.5]];
  const thumb = palmSide ? [40, -26, 96, 33, 52] : thumbIn ? [44, -18, 84, 32, 22] : [46, -30, 94, 33, 50];
  const fingerD = fingers.map(f => capsule(f[0], f[1], f[2], f[3], f[4]));
  const PALM = 'M -54 6 C -62 -30 -66 -72 -60 -104 C -40 -124 36 -128 60 -108 C 66 -80 64 -50 54 -20 C 48 -6 46 2 44 8 C 14 16 -26 16 -54 6 Z';
  const th = capsule(thumb[0], thumb[1], thumb[2], thumb[3], thumb[4]);
  if (!palmSide) P.path(g, th, F, { stroke: L, 'stroke-width': lw, 'stroke-linejoin': 'round' });
  fingerD.forEach(d => P.path(g, d, F, { stroke: L, 'stroke-width': lw, 'stroke-linejoin': 'round' }));
  P.path(g, PALM, F);
  if (palmSide) P.path(g, th, F, { stroke: L, 'stroke-width': lw, 'stroke-linejoin': 'round' });
  if (sil) return;
  // palm sides (no line across the knuckles), pinky-side shade, highlights
  P.path(g, 'M -54 6 C -62 -30 -66 -72 -60 -100', 'none', { stroke: L, 'stroke-width': lw, 'stroke-linecap': 'round' });
  if (palmSide) P.path(g, 'M 44 8 C 46 -2 50 -10 54 -20', 'none', { stroke: L, 'stroke-width': lw, 'stroke-linecap': 'round' });
  else P.path(g, 'M 44 8 C 46 -2 50 -12 52 -22', 'none', { stroke: L, 'stroke-width': lw, 'stroke-linecap': 'round' });
  P.path(g, 'M -54 6 C -62 -30 -66 -72 -60 -104 C -48 -110 -38 -112 -30 -112 C -40 -80 -40 -30 -30 10 C -40 10 -48 9 -54 6 Z', k.skinS, { opacity: .55 });
  fingers.forEach((f, i) => {
    const [bx, by, len, w, a] = f;
    // the pinky-side edge of each finger gets a thin shade strip
    P.path(g, capsule(bx - w * .22, by, len - 4, w * .42, a), k.skinS, { opacity: .45 });
    if (palmSide) {
      [.42, .7].forEach(p => { const [cx, cy] = along(bx, by, len * p + 4, a); P.path(g, `M ${f1(cx - w * .32)} ${f1(cy)} C ${f1(cx - w * .1)} ${f1(cy + 4)} ${f1(cx + w * .1)} ${f1(cy + 4)} ${f1(cx + w * .32)} ${f1(cy)}`, 'none', { stroke: k.line, 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: .55, transform: `rotate(${a} ${f1(cx)} ${f1(cy)})` }); });
    } else {
      const [nx, ny] = along(bx, by, len - w * .62, a);
      P.svg('ellipse', { cx: f1(nx), cy: f1(ny), rx: f1(w * .3), ry: f1(w * .4), fill: k.nail, transform: `rotate(${a} ${f1(nx)} ${f1(ny)})` }, g);
      P.svg('ellipse', { cx: f1(nx + 2), cy: f1(ny - 3), rx: f1(w * .1), ry: f1(w * .16), fill: '#fff', opacity: .8, transform: `rotate(${a} ${f1(nx)} ${f1(ny)})` }, g);
      const [kx, ky] = along(bx, by, len * .5, a);
      P.path(g, `M ${f1(kx - w * .22)} ${f1(ky + 2)} C ${f1(kx - w * .08)} ${f1(ky - 3)} ${f1(kx + w * .08)} ${f1(ky - 3)} ${f1(kx + w * .22)} ${f1(ky + 2)}`, 'none', { stroke: k.line, 'stroke-width': 2.2, 'stroke-linecap': 'round', opacity: .45, transform: `rotate(${a} ${f1(kx)} ${f1(ky)})` });
    }
  });
  if (palmSide) {
    P.path(g, 'M -40 -66 C -10 -58 20 -66 46 -84', 'none', { stroke: k.line, 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: .5 });
    P.path(g, 'M 30 -6 C 6 -24 -2 -50 4 -80', 'none', { stroke: k.line, 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: .45 });
    const [tx, ty] = along(thumb[0], thumb[1], thumb[2] - 18, thumb[4]);
    P.svg('ellipse', { cx: f1(tx), cy: f1(ty), rx: 9, ry: 12, fill: '#fff', opacity: .3, transform: `rotate(${thumb[4]} ${f1(tx)} ${f1(ty)})` }, g);
  } else {
    // knuckle bumps + back-of-hand gloss
    [[-40, -96], [-14, -104], [14, -106], [40, -100]].forEach(([x, y]) => P.svg('ellipse', { cx: x, cy: y + 4, rx: 9, ry: 5, fill: '#fff', opacity: .28 }, g));
    P.svg('ellipse', { cx: 22, cy: -58, rx: 16, ry: 26, fill: '#fff', opacity: .16, transform: 'rotate(10 22 -58)' }, g);
    const [nx, ny] = along(thumb[0], thumb[1], thumb[2] - 20, thumb[4]);
    P.svg('ellipse', { cx: f1(nx), cy: f1(ny), rx: 10, ry: 13, fill: k.nail, transform: `rotate(${thumb[4]} ${f1(nx)} ${f1(ny)})` }, g);
  }
}
// curled fist, knuckles to the viewer (finger rolls stacked); thumb: 'across' | 'up' | 'tuck'
function handFist(g, k, thumbMode) {
  const sil = k.sil, F = sil || k.skin, L = sil ? 'none' : k.line, lw = sil ? 0 : 3.6;
  const BODY = 'M -52 6 C -62 -30 -66 -90 -60 -128 C -40 -146 40 -148 62 -128 C 68 -90 64 -36 52 6 C 20 16 -22 16 -52 6 Z';
  P.path(g, BODY, F);
  if (thumbMode === 'up') P.path(g, capsule(-30, -112, 128, 40, -4), F, { stroke: L, 'stroke-width': lw });
  const rolls = [[-138, 34, -50, 66], [-106, 33, -54, 68], [-75, 31, -56, 66], [-46, 28, -54, 60]];
  if (!sil) P.path(g, 'M -52 6 C -62 -30 -66 -90 -60 -126', 'none', { stroke: L, 'stroke-width': lw, 'stroke-linecap': 'round' });
  for (let i = rolls.length - 1; i >= 0; i--) {
    const [y, h, x0, x1] = rolls[i];
    P.svg('rect', { x: x0, y, width: x1 - x0, height: h, rx: h / 2, fill: F, stroke: L, 'stroke-width': lw }, g);
    if (!sil) {
      P.svg('rect', { x: x0 + 4, y: y + h * .52, width: x1 - x0 - 10, height: h * .4, rx: h * .2, fill: k.skinS, opacity: .45 }, g);
      P.svg('ellipse', { cx: x1 - 16, cy: y + h * .34, rx: 9, ry: 5, fill: '#fff', opacity: .32 }, g);
      P.path(g, `M ${x0 + (x1 - x0) * .38} ${y + 6} C ${x0 + (x1 - x0) * .34} ${y + h * .4} ${x0 + (x1 - x0) * .34} ${y + h * .6} ${x0 + (x1 - x0) * .38} ${y + h - 6}`, 'none', { stroke: L, 'stroke-width': 2.2, 'stroke-linecap': 'round', opacity: .45 });
    }
  }
  if (thumbMode === 'up') {
    if (!sil) { P.svg('ellipse', { cx: -32, cy: -214, rx: 13, ry: 15, fill: k.nail }, g); P.svg('ellipse', { cx: -28, cy: -218, rx: 4, ry: 6, fill: '#fff', opacity: .8 }, g);
      P.path(g, capsule(-40, -112, 120, 14, -4), k.skinS, { opacity: .45 }); }
  } else if (thumbMode === 'across') {
    P.path(g, capsule(-64, -116, 104, 34, 78), F, { stroke: L, 'stroke-width': lw });
    if (!sil) { const [nx, ny] = along(-64, -116, 84, 78); P.svg('ellipse', { cx: f1(nx), cy: f1(ny), rx: 11, ry: 13, fill: k.nail, transform: `rotate(78 ${f1(nx)} ${f1(ny)})` }, g); }
  }
}
// phone grip: palm behind the phone, thumb over the left edge, fingertips over the right edge. screen(gScreen, w, h) draws the UI.
function handPhone(g, k, o) {
  const sil = k.sil, F = sil || k.skin, L = sil ? 'none' : k.line, lw = sil ? 0 : 3.6;
  const W = o.pw || 156, H = o.ph || 304, X = -W / 2 + 8, Y = -H - 34;
  P.path(g, 'M -54 6 C -62 -30 -66 -72 -62 -110 L 64 -110 C 66 -70 62 -36 52 -6 C 46 4 44 8 42 10 C 14 18 -26 18 -54 6 Z', F);
  if (!sil) P.path(g, 'M -54 6 C -62 -30 -66 -72 -62 -96', 'none', { stroke: L, 'stroke-width': lw, 'stroke-linecap': 'round' });
  // phone body
  P.svg('rect', { x: X - 4, y: Y + 4, width: W, height: H, rx: 28, fill: sil || C.INK, opacity: sil ? 1 : .5 }, g);
  P.svg('rect', { x: X, y: Y, width: W, height: H, rx: 28, fill: sil || C.INK }, g);
  if (!sil) {
    const sid = uid('ps');
    const scr = P.svg('g', {}, g);
    P.svg('clipPath', { id: sid }, scr).appendChild(P.svg('rect', { x: X + 9, y: Y + 9, width: W - 18, height: H - 18, rx: 20 }));
    const sg = P.svg('g', { 'clip-path': `url(#${sid})` }, scr);
    P.svg('rect', { x: X + 9, y: Y + 9, width: W - 18, height: H - 18, fill: o.screenBg || '#2E2266' }, sg);
    const inner = P.svg('g', { transform: `translate(${X + 9},${Y + 9})` }, sg);
    if (o.screen) o.screen(inner, W - 18, H - 18);
    P.path(sg, `M ${X + W * .55} ${Y} L ${X + W * .8} ${Y} L ${X + W * .2} ${Y + H} L ${X - 10} ${Y + H} Z`, '#fff', { opacity: .07 });
    P.svg('rect', { x: X + W / 2 - 22, y: Y + 16, width: 44, height: 10, rx: 5, fill: C.INK }, g);
    P.svg('rect', { x: X + W - 2, y: Y + 70, width: 5, height: 40, rx: 2, fill: C.INK }, g);
  }
  // fingertips curling over the right edge
  [[Y + H * .42, 30], [Y + H * .55, 30], [Y + H * .68, 29], [Y + H * .8, 26]].forEach(([y, w], i) => {
    P.path(g, capsule(X + W + 22 - i * 2, y, 44 - i * 2, w, -90), F, { stroke: L, 'stroke-width': lw });
    if (!sil) { const nx = X + W + 22 - i * 2 - 30 + i * 2, ny = y; P.svg('ellipse', { cx: nx, cy: ny - 1, rx: 8, ry: w * .3, fill: k.nail }, g); }
  });
  // thumb along the left edge, over the screen
  P.path(g, capsule(X - 6, Y + H - 6, 104, 34, 26), F, { stroke: L, 'stroke-width': lw });
  if (!sil) { const [nx, ny] = along(X - 6, Y + H - 6, 84, 26); P.svg('ellipse', { cx: f1(nx), cy: f1(ny), rx: 11, ry: 14, fill: k.nail, transform: `rotate(26 ${f1(nx)} ${f1(ny)})` }, g);
    P.path(g, capsule(X - 14, Y + H - 4, 96, 12, 26), k.skinS, { opacity: .45 }); }
}
// mic held in a fist (thumb across), head above
function handMic(g, k) {
  const sil = k.sil;
  if (!sil) {
    P.svg('rect', { x: -17, y: -232, width: 34, height: 250, rx: 15, fill: C.INK }, g);
    P.svg('rect', { x: 2, y: -226, width: 7, height: 232, rx: 3.5, fill: '#fff', opacity: .25 }, g);
    P.svg('rect', { x: -23, y: -246, width: 46, height: 22, rx: 8, fill: C.MINT }, g);
    P.svg('circle', { cx: 0, cy: -292, r: 52, fill: C.INK }, g);
    const cid = uid('mc'); P.svg('clipPath', { id: cid }, g).appendChild(P.svg('circle', { cx: 0, cy: -292, r: 46 }));
    const mesh = P.svg('g', { 'clip-path': `url(#${cid})` }, g);
    P.svg('circle', { cx: 0, cy: -292, r: 46, fill: '#3B2C74' }, mesh);
    for (let i = -5; i <= 5; i++) { P.svg('line', { x1: i * 10 - 60, y1: -350, x2: i * 10 + 60, y2: -230, stroke: '#fff', 'stroke-width': 2, opacity: .28 }, mesh); P.svg('line', { x1: i * 10 + 60, y1: -350, x2: i * 10 - 60, y2: -230, stroke: '#fff', 'stroke-width': 2, opacity: .28 }, mesh); }
    P.svg('ellipse', { cx: 16, cy: -312, rx: 14, ry: 10, fill: '#fff', opacity: .45, transform: 'rotate(-30 16 -312)' }, mesh);
  }
  handFist(g, k, 'across');
}

// draw one arm (sleeve + forearm + hand) into the portrait; h: { pose, at:[x,y], rot, s, flip, elbow:[x,y], sleeve, sleeveD, cuff, shadow }
P.arm = function (g, h, c) {
  const ag = P.svg('g', { class: 'arm' }, g);
  const [wx, wy] = h.at, [ex, ey] = h.elbow || [wx * 1.3, 820];
  const dx = ex - wx, dy = ey - wy, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const s = h.s || 1, ww = 33 * s, we = 62 * s, cuff = (h.cuff ?? 60) * s;
  const pt = (d, wd) => [[wx + ux * d + nx * wd, wy + uy * d + ny * wd], [wx + ux * d - nx * wd, wy + uy * d - ny * wd]];
  const [a1, a2] = pt(-6 * s, ww), [b1, b2] = pt(cuff, ww + 6 * s), [c1, c2] = pt(len + 40, we);
  const sk = h.skin || c.SKIN, sks = c.SKIN_S;
  // forearm skin (wrist -> cuff)
  P.path(ag, `M ${f1(a1[0])} ${f1(a1[1])} L ${f1(b1[0])} ${f1(b1[1])} L ${f1(b2[0])} ${f1(b2[1])} L ${f1(a2[0])} ${f1(a2[1])} Z`, sk, { stroke: c.SKIN_D, 'stroke-width': 3.6, 'stroke-linejoin': 'round' });
  P.path(ag, `M ${f1(a2[0])} ${f1(a2[1])} L ${f1(b2[0])} ${f1(b2[1])} L ${f1((b1[0] + b2[0]) / 2)} ${f1((b1[1] + b2[1]) / 2)} L ${f1((a1[0] + a2[0]) / 2)} ${f1((a1[1] + a2[1]) / 2)} Z`, sks, { opacity: .5 });
  // sleeve (cuff -> elbow, off frame)
  const [d1, d2] = pt(cuff - 6 * s, ww + 16 * s);
  const sl = h.sleeve || c.PINK_D, sld = h.sleeveD || c.PINK_DD;
  P.path(ag, `M ${f1(d1[0])} ${f1(d1[1])} L ${f1(c1[0])} ${f1(c1[1])} L ${f1(c2[0])} ${f1(c2[1])} L ${f1(d2[0])} ${f1(d2[1])} Z`, sl);
  const [m1] = pt(cuff - 6 * s, (ww + 16 * s) * .1), [m2] = pt(len + 40, we * .1);
  P.path(ag, `M ${f1(d2[0])} ${f1(d2[1])} L ${f1(c2[0])} ${f1(c2[1])} L ${f1(m2[0])} ${f1(m2[1])} L ${f1(m1[0])} ${f1(m1[1])} Z`, sld, { opacity: .55 });
  P.path(ag, `M ${f1(d1[0])} ${f1(d1[1])} L ${f1(d2[0])} ${f1(d2[1])}`, 'none', { stroke: sld, 'stroke-width': 10 * s, 'stroke-linecap': 'round' });
  // hand
  const ang = Math.atan2(-uy, -ux) * 180 / Math.PI + 90 + (h.rot || 0);   // hand "up" follows the forearm, + extra rotation
  const k = { skin: sk, skinS: sks, line: c.SKIN_D, nail: '#FFE6EF' };
  const tf = `translate(${f1(wx)},${f1(wy)}) rotate(${f1(ang)}) scale(${h.flip ? -s : s},${s})`;
  if (h.shadow) { const sh = P.svg('g', { transform: `translate(${h.shadow[0]},${h.shadow[1]})`, opacity: .32 }, ag); drawHand(P.svg('g', { transform: tf }, sh), h, Object.assign({}, k, { sil: c.SKIN_D })); }
  drawHand(P.svg('g', { transform: tf, class: 'hand' }, ag), h, k);
  return ag;
};
function drawHand(g, h, k) {
  if (h.pose === 'open') handOpen(g, k, false);
  else if (h.pose === 'cheek') handOpen(g, k, false, true);
  else if (h.pose === 'palm') handOpen(g, k, true);
  else if (h.pose === 'fist') handFist(g, k, 'across');
  else if (h.pose === 'tuck') handFist(g, k, 'tuck');
  else if (h.pose === 'thumb') handFist(g, k, 'up');
  else if (h.pose === 'phone') handPhone(g, k, h);
  else if (h.pose === 'mic') handMic(g, k);
}

// ================= the portrait =================
// o: { hijab | hair:'short'|'fade'|'long'|'bun'|'cap', male, glasses:'round'|'rect'|'visor', phones, smile 0..1, open, lids,
//      look:[dx,dy], brow, older, pal, garment, garmentD, cloth:'tee'|'jersey'|'coat'|'chef', beard:'stubble'|'moustache'|'full',
//      hat:'chef', steth, earrings, number, hands:[...] }  -> returns root; root.P = { lids:[], iris:[], arms:[] }
P.portrait = function (g, o = {}) {
  const c = Object.assign({}, C, o.pal || {});
  const root = P.svg('g', { class: 'portrait' }, g);
  const parts = { lids: [], iris: [], arms: [] };
  root.P = parts;
  const defs = P.svg('defs', {}, root);
  const id = uid('pp');
  const hairPal = o.hairPal || [c.PINK_L, c.PINK_D, o.hairC || c.PINK_DD];
  defs.innerHTML = `
    <radialGradient id="${id}sk" cx="64%" cy="34%" r="78%"><stop offset="0" stop-color="${c.SKIN_L}"/><stop offset=".55" stop-color="${c.SKIN}"/><stop offset="1" stop-color="#FAA6C0"/></radialGradient>
    <linearGradient id="${id}hj" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.PINK_L}"/><stop offset=".42" stop-color="${c.PINK}"/><stop offset="1" stop-color="${c.PINK_D}"/></linearGradient>
