<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paper cut: sample</title><style>
@font-face{font-family:"Montserrat";src:url("fonts/montserrat-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:block}

html,body,#stage{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#12394A}
#stage{position:relative}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.layer svg,.strip svg,.rotor svg{position:absolute;left:0;top:0;overflow:visible;display:block}

.d1{filter:drop-shadow(0 2px 2px rgba(0,0,0,.28)) drop-shadow(0 9px 13px rgba(0,0,0,.28))}

.d4{filter:drop-shadow(0 3px 3px rgba(0,0,0,.30)) drop-shadow(0 22px 34px rgba(0,0,0,.34))}
.d5{filter:drop-shadow(0 3px 3px rgba(0,0,0,.30)) drop-shadow(0 28px 42px rgba(0,0,0,.38))}
.c-a{fill:#1E6072}.c-b{fill:#2F8C8C}.c-cream{fill:#F2E3C6}.c-accent{fill:#F0683A}
.strip{position:absolute}
.sway{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 0}
.txt{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#12394A;white-space:nowrap}
.en-title{font:800 90px/1 "Montserrat",sans-serif}
.ar-title{font:700 104px/1.35 "IBM Plex Sans Arabic",sans-serif}
.num{font:800 210px/1 "Montserrat",sans-serif}
.en-sec{font:600 58px/1 "Montserrat",sans-serif}
.ar-sec{font:500 66px/1.35 "IBM Plex Sans Arabic",sans-serif}
.rotor{position:absolute;width:0;height:0}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;mix-blend-mode:multiply;opacity:.08;pointer-events:none}
</style></head>
